<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Yu-Gi-Oh! Scanner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🃏 Yu-Gi-Oh! Scanner</h1>
  </header>

  <main>
    <!-- Scan -->
    <section id="page-scan" class="page active">
      <div class="scan-container">
        <div id="camera-preview-wrap">
          <video id="camera-preview" autoplay playsinline muted></video>
          <div class="scan-frame"></div>
        </div>
        <div id="scan-actions">
          <button id="btn-start-camera" class="btn primary">📷 Activer la caméra</button>
          <button id="btn-capture" class="btn primary hidden">📸 Scanner la carte</button>
          <button id="btn-stop-camera" class="btn hidden">Arrêter</button>
          <canvas id="capture-canvas" class="hidden"></canvas>
        </div>
        <p id="scan-status" class="status"></p>
        <div id="ocr-candidates" class="card-grid"></div>
      </div>
    </section>

    <!-- Recherche -->
    <section id="page-search" class="page">
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Nom de la carte…" autocomplete="off">
        <button id="btn-search" class="btn primary">Rechercher</button>
      </div>
      <div id="search-suggestions" class="suggestions hidden"></div>

      <details id="filters" class="filters">
        <summary>⚙️ Filtres</summary>
        <div class="filters-grid">
          <label>Type
            <select id="filter-type"><option value="">—</option></select>
          </label>
          <label>Attribut
            <select id="filter-attribute"><option value="">—</option></select>
          </label>
          <label>Race / Type-Monstre
            <select id="filter-race"><option value="">—</option></select>
          </label>
          <label>Niveau max
            <input type="number" id="filter-level" min="1" max="12" placeholder="—">
          </label>
          <label>Set
            <input type="text" id="filter-set" list="set-list" placeholder="ex: Metal Raiders…" autocomplete="off">
            <datalist id="set-list"></datalist>
          </label>
          <label>Rareté
            <select id="filter-rarity">
              <option value="">—</option>
              <option>Common</option><option>Rare</option><option>Super Rare</option>
              <option>Ultra Rare</option><option>Secret Rare</option>
              <option>Ultimate Rare</option><option>Ghost Rare</option>
              <option>Platinum Rare</option><option>Quarter Century Secret Rare</option>
            </select>
          </label>
        </div>
      </details>

      <div id="search-results" class="card-grid"></div>
      <p id="search-status" class="status"></p>
    </section>

    <!-- Collection -->
    <section id="page-collection" class="page">
      <div class="collection-header">
        <div id="collection-stats" class="stats"></div>
        <div class="collection-actions">
          <button id="btn-export-csv" class="btn">📄 CSV</button>
          <button id="btn-export-json" class="btn">{ } JSON</button>
          <button id="btn-import" class="btn">📥 Importer</button>
          <input type="file" id="import-file" accept=".json" class="hidden">
        </div>
      </div>
      <input type="search" id="collection-filter" placeholder="Filtrer ma collection…">
      <div id="collection-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-page="scan" class="active">📷<span>Scanner</span></button>
    <button data-page="search">🔍<span>Recherche</span></button>
    <button data-page="collection">📚<span>Collection</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
